name: babyplan
description: "小芽 BabyPlan：家庭陪伴助手 Android 客户端。"
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.0.0
  http: 1.6.0
  image_picker: ^1.2.4
  path: 1.9.1
  path_provider: 2.1.5
  sqflite: 2.4.6
  timezone: 0.11.2
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.7

hooks:
  user_defines:
    sqlite3:
      # 手机正式运行使用 sqflite 的 Android 平台实现；FFI 只用于本机数据库测试。
      # 使用系统 SQLite 可避免构建时从 GitHub 下载原生库，测试与联网环境也更稳定。
      source: system
      name_windows: winsqlite3
      name: sqlite3

flutter:
  uses-material-design: true
