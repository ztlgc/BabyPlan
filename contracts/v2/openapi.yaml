          minLength: 1
          maxLength: 500
        requestId: *id008
        details:
          oneOf:
          - $ref: '#/components/schemas/ConflictDetails'
          - type: object
            not:
              required:
              - currentRevision
            additionalProperties: true
      required:
      - code
      - message
      - requestId
    WriteMeta:
      type: object
      additionalProperties: false
      properties:
        operationId: *id008
        baseRevision: *id011
      required:
      - operationId
      - baseRevision
    Ack:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        revision: *id011
        changeSeq:
          type: integer
          minimum: 0
      required:
      - id
      - revision
      - changeSeq
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id008
