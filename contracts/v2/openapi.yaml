openapi: 3.1.0
info:
  title: BabyPlan v2 多成员陪伴实施合同
  version: 2.2.0
  description: 实施合同。各端以此为准；接口列入合同不表示已经实现。家庭与内容权限隔离。
servers:
- url: http://127.0.0.1:4318/v2
  description: 本地开发目标；服务运行状态另验收
security: &id009
- bearerSession: []
- cookieSession: []
paths:
  /sessions:
    post:
      operationId: createSession
      summary: 登录
      description: 客户端显式选择mobile/web；密码使用Argon2id散列。mobile不设置Cookie。web检查同源Origin，设置bp_session/bp_refresh，Path=/v2、HttpOnly、SameSite=Strict；Secure属性跟随PUBLIC_BASE_URL使用的HTTP或HTTPS协议。HTTP仅限可信局域网。限速且不记录密码/令牌。
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': &id001
          description: 参数、日期或单位不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: 会话无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: 角色不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: 对象不存在或不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id005
          description: 修订、幂等或业务冲突；details含current/submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id006
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id007
          description: 暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                deviceId: &id008
                  type: string
                  format: uuid
                clientType:
                  type: string
                  enum:
                  - mobile
                  - web
              required:
              - email
              - password
              - deviceId
              - clientType
  /sessions/refresh:
    post:
      operationId: refreshSession
      summary: 旋转刷新会话
      description: mobile须X-Refresh-Token，web须刷新Cookie且Origin与X-CSRF-Token正确。绑定deviceId和clientType；同一会话串行轮转。响应交付新令牌，旧令牌复用撤销整条会话家族。
      security:
      - refreshCookie: []
      - refreshHeader: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deviceId: *id008
                clientType:
                  type: string
                  enum:
                  - mobile
                  - web
              required:
              - deviceId
              - clientType
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
  /sessions/current:
    delete:
      operationId: deleteSession
      summary: 退出当前设备
      description: 退出当前设备
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accepted:
                    const: true
                required:
                - accepted
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
  /accounts/recovery:
    post:
      operationId: requestRecovery
      summary: 请求账号恢复
      description: 不泄露账号是否存在；一次性重置令牌24小时有效，管理员安全交付或邮件发送。
      security: []
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accepted:
                    const: true
                required:
                - accepted
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
  /accounts/reset:
    post:
      operationId: resetPassword
      summary: 用一次性令牌重置密码
      description: 令牌单次使用，仅存摘要；重置后撤销既有会话。
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accepted:
                    const: true
                required:
                - accepted
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 256
              required:
              - token
              - newPassword
  /bootstrap:
    get:
      operationId: getBootstrap
      summary: 读取本人家庭与孩子
      description: 读取本人家庭与孩子
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  families:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                    minItems: 0
                    maxItems: 10
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
                    minItems: 0
                    maxItems: 20
                  contentRoles:
                    type: array
                    items:
                      type: string
                      enum:
                      - editor
                      - reviewer
                      - publisher
                    minItems: 0
                    maxItems: 3
                required:
                - user
                - families
                - children
                - contentRoles
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /families:
    post:
      operationId: createFamily
      summary: 创建私人家庭
      description: 仅获部署引导授权的用户可创建；IANA时区校验，一次事务创建owner与首个孩子。
      security: *id009
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 100
                child:
                  $ref: '#/components/schemas/AgeInput'
              required:
              - operationId
              - name
              - timezone
              - child
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
  /families/{familyId}/invitations:
    post:
      operationId: createInvitation
      summary: 邀请照护者
      description: 仅owner；可由管理员设置4～32位邀请码，也可省略code生成高熵单次令牌。邀请码24小时失效且只能使用一次，服务端仅存摘要。邀请码应避开生日、手机号等易猜内容。
      security: *id009
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: *id008
                  invitationToken:
                    type: string
                    minLength: 4
                    maxLength: 4096
                  expiresAt: &id015
                    type: string
                    format: date-time
                required:
                - id
                - invitationToken
                - expiresAt
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: familyId
        in: path
        required: true
        schema: *id008
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
                code:
                  type: string
                  minLength: 4
                  maxLength: 32
                  description: 可选自定义邀请码；支持中文、字母、数字、下划线或短横线，不能包含空白。
              required:
              - operationId
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: 接受家庭邀请
      description: 先登录；锁定邀请并事务检查未使用/未过期，新增成员，不能提权成owner。
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
              - operationId
              - token
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
  /invitations/redeem:
    post:
      operationId: redeemInvitation
      summary: 凭邀请创建账号并加入家庭
      description: 无公开注册；只有有效一次性邀请可创建账号。锁定令牌并事务创建账号/成员；已有邮箱不覆盖密码，提示走登录接受邀请。限速、防重复、令牌仅存摘要。
      security: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  sessionId:
                    type: string
                    format: uuid
                  accessToken:
                    anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                    - type: 'null'
                  refreshToken:
                    anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                    - type: 'null'
                  expiresAt: &id010
                    type: string
                    format: date-time
                  refreshExpiresAt: *id010
                  csrfToken:
                    anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 256
                    - type: 'null'
                  family:
                    $ref: '#/components/schemas/Family'
                required:
                - user
                - sessionId
                - accessToken
                - refreshToken
                - expiresAt
                - refreshExpiresAt
                - csrfToken
                - family
                description: mobile返回两种令牌且csrfToken=null；web令牌字段均null，令牌只通过HttpOnly Cookie交付。访问15分钟、刷新30天。刷新每次轮转，旧令牌复用撤销同一会话令牌家族。
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
                deviceId: *id008
                clientType:
                  type: string
                  enum:
                  - mobile
                  - web
              required:
              - operationId
              - token
              - email
              - password
              - displayName
              - deviceId
              - clientType
  /families/{familyId}/members/{userId}:
    delete:
      operationId: removeMember
      summary: 移除家庭成员
      description: 仅owner；禁止移除最后一位owner，撤销该成员家庭访问与后续下载授权。
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: familyId
        in: path
        required: true
        schema: *id008
      - name: userId
        in: path
        required: true
        schema: *id008
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
              required:
              - operationId
  /children/{childId}:
    patch:
      operationId: updateChild
      summary: 更新孩子年龄精度
      description: months必须有ageMonths/ageAsOf且birthDate为空；birthDate模式相反。家庭成员可编辑，保留审计。
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '429': *id006
        '503': *id007
        '410':
          description: 游标或快照过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 媒体或请求过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务或内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: childId
        in: path
        required: true
        schema: *id008
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 使用Web Cookie时必填且须同源；Bearer手机请求不需要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: *id008
                baseRevision: &id011
                  type: integer
                  minimum: 0
                age:
                  $ref: '#/components/schemas/AgeInput'
              required:
              - operationId
              - baseRevision
              - age
  /children/{childId}/plans/ensure:
    post:
      operationId: ensurePlans
      summary: 补足未来七天安排
      description: 日期由服务端家庭时区计算；唯一约束、锁与确定性编排，保护已有修改，不接受任意儿童familyId。
      security: *id009
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  days:
                    type: array
                    items:
                      $ref: '#/components/schemas/DayPlan'
                    minItems: 0
                    maxItems: 7
                required:
                - days
        '400': *id001
        '401': *id002
        '403': *id003
