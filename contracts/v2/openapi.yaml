    ReviewEvidence:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum:
          - editorial_review
          - expert_review
          - family_trial
          - rights_license
        cardId:
          type: string
          minLength: 1
          maxLength: 60
        revision:
          type: integer
          minimum: 1
        contentHash: *id037
        actorId:
          type: string
          minLength: 1
          maxLength: 100
        actorKind:
          const: human
        createdAt: *id036
        decision:
          type: string
          enum:
          - approved
          - rejected
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 1000
        authorId:
          type: string
          minLength: 1
          maxLength: 100
        selfReviewed:
          type: boolean
        checks:
          type: array
          items:
            type: string
            enum:
            - sources
            - age_safety
            - language
            - rights
          minItems: 4
          maxItems: 4
          uniqueItems: true
        qualificationRef:
          type: string
          minLength: 1
          maxLength: 1000
        completedAt: *id036
        authorizationRef:
          type: string
          minLength: 1
          maxLength: 1000
        scope:
          type: string
          minLength: 1
          maxLength: 1000
        allowedEnvironments:
          type: array
          items:
            type: string
            enum:
            - private_trial
            - public
          minItems: 1
          maxItems: 2
          uniqueItems: true
      required:
      - id
      - kind
      - cardId
      - revision
      - contentHash
      - actorId
      - actorKind
      - createdAt
      - decision
      - evidenceRef
      allOf:
      - if:
          properties:
            kind:
              const: editorial_review
        then:
          required:
          - authorId
          - selfReviewed
          - checks
      - if:
          properties:
            kind:
              const: expert_review
        then:
          required:
          - authorId
          - selfReviewed
          - qualificationRef
      - if:
          properties:
            kind:
              const: family_trial
        then:
          required:
          - completedAt
      - if:
          properties:
            kind:
              const: rights_license
        then:
          required:
          - authorizationRef
          - scope
          - allowedEnvironments
