components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
    cookieSession:
      type: apiKey
      in: cookie
      name: bp_session
    refreshCookie:
      type: apiKey
      in: cookie
      name: bp_refresh
    refreshHeader:
      type: apiKey
      in: header
      name: X-Refresh-Token
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
